services:
  api:
    image: python:3.11-slim
    working_dir: /app/backend
    volumes: [".:/app", "waymark-data:/data"]
    environment:
      DATABASE_URL: sqlite:////data/waymark.db
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me-0123456789abcdef}
    command: sh -c "pip install -q -e . fastapi 'uvicorn[standard]' sqlalchemy alembic pydantic-settings pyjwt bcrypt apscheduler python-multipart && alembic upgrade head && python -m app.seed.run && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports: ["8000:8000"]
  web:
    image: node:22
    working_dir: /app/frontend
    volumes: [".:/app"]
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    command: sh -c "npm ci && npm run dev"
    ports: ["3000:3000"]
    depends_on: [api]
volumes:
  waymark-data:
